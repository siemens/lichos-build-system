[tool.flake8]
ignore = ["E501"]

[project]
name = "lichoscli"
version = "0.3.1"
description = "Automate package workflows for Linux distribution development"
readme = "README.md"
authors = [
    {name = "Ludwig Nussel", email = "ludwig.nussel@siemens.com"},
    {name = "Sami Alzein", email = "sami.alzein@siemens.com"},
    {name = "Siemens eMobility Packaging Team", email = "packages-emobility.infra@siemens.com"},
]
maintainers = [
    {name = "Ludwig Nussel", email = "ludwig.nussel@siemens.com"},
    {name = "Sami Alzein", email = "sami.alzein@siemens.com"},
    {name = "Siemens eMobility Packaging Team", email = "packages-emobility.infra@siemens.com"},
]
license = {text = "MIT"}
keywords = ["packaging", "build", "debian", "lichOS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
requires-python = ">=3.10"
dependencies = [
    "GitPython",
    "python-gitlab==4.9.0",
    "pyyaml",
    "requests",
    "packaging",
    "diskcache",
    "cachetools",
    "xdg",
    "argcomplete",
    "python-dateutil",
]

[project.urls]
Homepage = "https://github.com/siemens/lichoscli"
Repository = "https://github.com/siemens/lichoscli"
Documentation = "https://github.com/siemens/lichoscli"
Issues = "https://github.com/siemens/lichoscli/issues"

[project.scripts]
lichoscli = "lichoscli.cli:main"
lbs = "lichoscli.cli:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lichoscli*"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov"
]
questionary = [
    "questionary",
]
dev = [
    "pylint",
    "black",
    "isort",
    "ruff"
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
[tool.pylint.'MESSAGES CONTROL']
disable = ["C0116", "C0115", "C0301", "C0114"]

[tool.pylint.MAIN]
load-plugins = ["pylint.extensions.typing"]
py-version = "3.10" 


[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "UP",     # pyupgrade (detects deprecated typing imports)
    "I",      # isort
]
ignore = [
    "E501",   # line too long (handled by black)
    "F403",   # star imports (used intentionally in utils/__init__.py)
    "F405",   # undefined names from star imports
]

[tool.ruff.lint.pyupgrade]
# Keep runtime typing imports even when using from __future__ import annotations
keep-runtime-typing = false

[dependency-groups]
dev = [
    "ruff (>=0.14.0,<0.15.0)"
]